<!DOCTYPE html>
<html>
<head>
<title>Add Device</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="center">

<div class="card">
<h2>Add Device</h2>

<form method="post">
{% if error %}
<div class="alert-error">
    {{ error }}
</div>
{% endif %}    
<input name="device_id" placeholder="Device ID" required>
<button class="btn">Add</button>
</form>

</div>
</body>
</html>
