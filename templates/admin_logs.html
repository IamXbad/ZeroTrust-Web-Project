<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edge Logs</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="layout">

    <!-- ===== SIDEBAR ===== -->
    <div class="sidebar">
        <div class="sidebar-brand">🔐 Zero Trust</div>

        <div class="sidebar-menu">
            <a href="{{ url_for('dashboard') }}">📊 Dashboard</a>
            <a href="{{ url_for('add_device') }}">➕ Add Device</a>
            <a href="{{ url_for('dashboard') }}">📡 Live Data</a>

            <div class="sidebar-section">Admin</div>

            <a href="{{ url_for('admin_users') }}">👥 Manage Users</a>
            <a href="{{ url_for('admin_logs') }}" class="active">🛡 Edge Logs</a>
            <a href="{{ url_for('admin_login_logs') }}">📍 Login Logs</a>
        </div>

        <div class="sidebar-footer">
            <a href="{{ url_for('logout') }}">🚪 Logout</a>
        </div>
    </div>

    <!-- ===== CONTENT ===== -->
    <div class="content">

        <div class="card-section">
            <h2>🛡 Edge Logs</h2>

            <div class="logs-container">

                {% if logs %}
                    {% for log in logs %}

                        {% if "Unauthorized" in log %}
                        <div class="log-entry log-danger">
                            <span class="log-tag danger">BLOCKED</span>
                            <span>{{ log }}</span>
                        </div>
                        {% else %}
                        <div class="log-entry log-safe">
                            <span class="log-tag safe">OK</span>
                            <span>{{ log }}</span>
                        </div>
                        {% endif %}

                    {% endfor %}
                {% else %}
                    <p class="muted">No logs found</p>
                {% endif %}

            </div>
        </div>

    </div>

</div>

</body>
</html>
